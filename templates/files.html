<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSLog — Arquivos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #111; color: #eee; }
    .navbar {
      background: #1a1a1a;
      border-bottom: 0.5px solid #2a2a2a;
      padding: 0 1.5rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-size: 16px; font-weight: 600; color: #6fcf3f; letter-spacing: 2px; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      padding: 6px 14px;
      font-size: 13px;
      color: #888;
      border-radius: 8px;
      text-decoration: none;
    }
    .nav-link.active { background: #222; color: #6fcf3f; border: 0.5px solid #2a2a2a; }
    .nav-link:hover { color: #eee; }
    .logout {
      padding: 6px 12px;
      font-size: 12px;
      color: #666;
      border: 0.5px solid #2a2a2a;
      border-radius: 8px;
      text-decoration: none;
    }
    .logout:hover { color: #e05555; border-color: #e05555; }
    .content { padding: 2rem 1.5rem; max-width: 900px; margin: 0 auto; }
    .page-title { font-size: 16px; font-weight: 500; color: #eee; margin-bottom: 4px; }
    .page-sub { font-size: 12px; color: #555; margin-bottom: 1.5rem; }
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      background: #1a1a1a;
      border: 0.5px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .file-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .file-name { font-size: 14px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-path { font-size: 11px; color: #555; }
    .dl-btn {
      padding: 6px 16px;
      font-size: 12px;
      color: #6fcf3f;
      border: 0.5px solid #6fcf3f;
      border-radius: 8px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .dl-btn:hover { background: #6fcf3f; color: #111; }
    .empty { color: #555; font-size: 13px; margin-top: 2rem; text-align: center; }
  </style>
</head>
<body>
  <div class="navbar">
    <div style="display:flex;align-items:center;gap:1.5rem;">
      <span class="brand">RSLOG</span>
      <div class="nav-links">
        <a href="/files?token={{ token }}" class="nav-link active">Arquivos</a>
        <a href="/reports?token={{ token }}" class="nav-link">Relatórios</a>
        <a href="/docs?token={{ token }}" class="nav-link">Documentação</a>
      </div>
    </div>
    <a href="/logout?token={{ token }}" class="logout">SAIR</a>
  </div>
  <div class="content">
    <p class="page-title">Arquivos</p>
    <p class="page-sub">Espelho do Google Drive — Posto Jacaraípe</p>
    <div class="file-list">
      {% for arq in arquivos %}
      <div class="file-item">
        <div class="file-info">
          <span class="file-name">{{ arq.name }}</span>
          <span class="file-path">{{ arq._caminho }}</span>
        </div>
        <a href="/download/{{ arq.id }}?token={{ token }}" class="dl-btn">⬇ Baixar</a>
      </div>
      {% else %}
      <p class="empty">Nenhum arquivo encontrado no Drive.</p>
      {% endfor %}
    </div>
  </div>
</body>
</html>
